<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { display: block; width: 100%; max-width: 800px; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const params = new URLSearchParams(window.location.search);
const rawName = params.get('name');
const TEXT = (rawName || '?name=').toUpperCase();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 800, H = 420;
canvas.width = W;
canvas.height = H;
canvas.style.height = H + 'px';

document.title = rawName ? `Happy Birthday, ${rawName}!` : 'Happy Birthday';

const CHARS = '░▒▓█▄▀■□▪▫●○◆◇★☆♦♣♠♥αβγδεζ@#$%&*+~^';

const PALETTE = [
  '#b39ddb','#9575cd','#7c43bd','#ce93d8','#f48fb1',
  '#80deea','#80cbc4','#fff176','#ffcc80','#ef9a9a'
];

function pickColor() { return PALETTE[Math.floor(Math.random() * PALETTE.length)]; }

let particles = [], celebs = [];
let state = 'forming';
let tick = 0, formTimer = 0;

function getFontSize() {
  const len = TEXT.length;
  if (len <= 3) return 150;
  if (len <= 5) return 120;
  if (len <= 7) return 90;
  if (len <= 10) return 68;
  return 52;
}

function sampleText() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const oc = off.getContext('2d');
  const fs = getFontSize();
  oc.fillStyle = '#fff';
  oc.font = `900 ${fs}px Arial Black, Arial`;
  oc.textAlign = 'center';
  oc.textBaseline = 'middle';
  oc.fillText(TEXT, W / 2, H / 2 - 20);
  const d = oc.getImageData(0, 0, W, H).data;
  const pts = [];
  const step = 6;
  for (let y = 0; y < H; y += step)
    for (let x = 0; x < W; x += step)
      if (d[(y * W + x) * 4] > 128) pts.push({ x, y });
  return pts;
}

function spawnParticles() {
  const targets = sampleText().sort(() => Math.random() - 0.5);
  particles = [];
  const n = Math.min(targets.length, 600);
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 300 + Math.random() * 200;
    particles.push({
      x: W / 2 + Math.cos(angle) * dist,
      y: H / 2 + Math.sin(angle) * dist,
      tx: targets[i].x, ty: targets[i].y,
      vx: 0, vy: 0,
      char: CHARS[Math.floor(Math.random() * CHARS.length)],
      color: pickColor(),
      size: 10 + Math.random() * 6,
      delay: Math.random() * 40,
      alpha: 0,
      mode: 'target'
    });
  }
}

function explodeParticles() {
  for (const p of particles) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 8;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed - 2;
    p.mode = 'explode';
    p.gravity = 0.08 + Math.random() * 0.06;
    p.char = CHARS[Math.floor(Math.random() * CHARS.length)];
    p.color = pickColor();
    p.fade = 0.015 + Math.random() * 0.015;
  }
  celebs = [];
  for (let i = 0; i < 40; i++) {
    celebs.push({
      x: Math.random() * W, y: -20 - Math.random() * 100,
      vy: 1.5 + Math.random() * 2.5, vx: (Math.random() - 0.5) * 1.5,
      char: CHARS[Math.floor(Math.random() * CHARS.length)],
      color: pickColor(), size: 12 + Math.random() * 8,
      alpha: 1, rot: Math.random() * Math.PI * 2,
      rotv: (Math.random() - 0.5) * 0.1, gravity: 0.04
    });
  }
}

function drawBackground() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const x = (i * 137.5) % W, y = (i * 97.3) % H;
    ctx.globalAlpha = 0.12 + 0.08 * Math.sin(tick * 0.02 + i);
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.font = '9px monospace';
    ctx.fillText(CHARS[i % CHARS.length], x, y);
  }
  ctx.globalAlpha = 1;
}

function drawUI() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '18px monospace';
  ctx.fillStyle = '#ce93d8';
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(tick * 0.05);
  ctx.fillText('Happy Birthday', W / 2, H - 48);
  ctx.font = '13px monospace';
  ctx.fillStyle = '#80deea';
  ctx.globalAlpha = 0.5;
  ctx.fillText('[ click to celebrate ]', W / 2, H - 24);
  ctx.restore();
}

function update() {
  tick++;
  if (state === 'forming') {
    let settled = 0;
    for (const p of particles) {
      if (tick < p.delay) continue;
      p.alpha = Math.min(1, p.alpha + 0.04);
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1.5) { settled++; p.x = p.tx; p.y = p.ty; continue; }
      const speed = Math.max(0.5, dist * 0.08);
      p.x += (dx / dist) * speed;
      p.y += (dy / dist) * speed;
      if (tick % 3 === 0) p.char = CHARS[Math.floor(Math.random() * CHARS.length)];
    }
    if (settled > particles.length * 0.92) {
      formTimer++;
      if (formTimer > 60) for (const p of particles) p.char = '█';
    }
  } else if (state === 'exploding') {
    let alive = 0;
    for (const p of particles) {
      p.vy += p.gravity; p.x += p.vx; p.y += p.vy;
      p.alpha -= p.fade;
      if (tick % 4 === 0) p.char = CHARS[Math.floor(Math.random() * CHARS.length)];
      if (p.alpha > 0) alive++;
    }
    for (const c of celebs) {
      c.vy += c.gravity; c.x += c.vx; c.y += c.vy; c.rot += c.rotv;
      if (c.y > H + 20) {
        c.y = -20; c.x = Math.random() * W;
        c.vy = 1.5 + Math.random() * 2; c.vx = (Math.random() - 0.5) * 1.5; c.alpha = 1;
      }
    }
    if (alive < 10 && tick % 300 === 0) { state = 'forming'; formTimer = 0; spawnParticles(); }
  }
}

function draw() {
  drawBackground();
  for (const p of particles) {
    if (p.alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.font = `${p.size}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.char, p.x, p.y);
    ctx.restore();
  }
  if (state === 'exploding') {
    for (const c of celebs) {
      ctx.save();
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = c.color;
      ctx.font = `${c.size}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillText(c.char, 0, 0);
      ctx.restore();
    }
  }
  drawUI();
}

canvas.addEventListener('click', () => {
  if (state === 'forming') { state = 'exploding'; explodeParticles(); }
  else { state = 'forming'; formTimer = 0; spawnParticles(); }
});

spawnParticles();
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
